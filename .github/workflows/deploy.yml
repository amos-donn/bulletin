name: Deploy

# Every push to main ships the Worker. Typecheck and tests run first, so a
# broken push fails here instead of on the live URL.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # The D1 database has to exist before it can be bound. With the secret
      # present we point the config at it and apply the schema; without it the
      # Worker is deployed with no database and scrapes on every visit.
      - name: Configure the D1 binding
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          if [ -z "$D1_DATABASE_ID" ]; then
            echo "::warning::No D1_DATABASE_ID secret. Deploying without the bulletin cache."
            python3 - <<'PY'
          import re
          text = open('wrangler.toml').read()
          text = re.sub(r'\n\[\[d1_databases\]\][\s\S]*$', '\n', text)
          open('wrangler.toml', 'w').write(text)
          PY
            echo "HAS_D1=0" >> "$GITHUB_ENV"
          else
            sed -i "s|^database_id = .*|database_id = \"$D1_DATABASE_ID\"|" wrangler.toml
            echo "HAS_D1=1" >> "$GITHUB_ENV"
          fi

      - name: Apply the database schema
        if: env.HAS_D1 == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute bulletin --remote --file=migrations/0001_init.sql --yes

      - name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
