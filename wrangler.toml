name = "sja-daily-bulletin"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[vars]
BULLETIN_URL = "https://stjacademy.org/a-culture-of-caring-and-respect/sja-news/daily-bulletin/"

# Bindings added in the dashboard are replaced by this file on the next Wrangler
# deploy, so the database lives here. The Worker creates its tables on first use
# (src/cache.ts); migrations/0001_init.sql holds the same SQL for running by hand.
[[d1_databases]]
binding = "DB"
database_name = "bulletin"
database_id = "873981a3-8f84-4782-b65a-d81583e3c2c8"

# FIRECRAWL_API_KEY is a secret, not a var: `npx wrangler secret put FIRECRAWL_API_KEY`.
