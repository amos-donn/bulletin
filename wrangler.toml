name = "sja-daily-bulletin"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[vars]
BULLETIN_URL = "https://stjacademy.org/a-culture-of-caring-and-respect/sja-news/daily-bulletin/"

# Caching is off until this points at a real database: without a binding the
# Worker scrapes the school page on every visit. Bindings added in the dashboard
# are replaced by this file on the next Wrangler deploy, so pin it here.
# Uncomment the four lines and paste the database id to turn caching on.
#
# [[d1_databases]]
# binding = "DB"
# database_name = "bulletin"
# database_id = "__D1_DATABASE_ID__"

# FIRECRAWL_API_KEY is a secret, not a var: `npx wrangler secret put FIRECRAWL_API_KEY`.
